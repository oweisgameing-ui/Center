<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>دخول المدرس</title>
<link rel="stylesheet" href="./shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<script src="./app-common.js"></script>
</head>
<body>
<div id="shell"><div id="app"></div></div>

<script>
let MODE = 'login'; // 'login' | 'create'

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="brand">
    <div class="brand-mark">س</div>
    <div><div class="brand-name">سنتر المدرسين</div><div class="brand-sub">بوابة المدرس</div></div>
  </div>
  <div class="hero">
    <h1>${MODE==='login' ? 'أهلاً بعودتك، سجّل دخولك لمتابعة السنتر' : 'أنشئ حساب السنتر الخاص بك'}</h1>
    <p>${MODE==='login' ? 'الدخول بكلمة المرور الخاصة بحسابك فقط.' : 'اختر اسم السنتر وكلمة مرور قوية لحماية بياناتك.'}</p>
  </div>

  ${MODE==='login' ? tplLogin() : tplCreate()}

  <a class="link-btn" href="./student-login.html" style="color:var(--dim);">دخول الطلاب من هنا</a>
  `;
}

function tplLogin(){
  return `
  <div class="card">
    <div class="field">
      <label>كلمة المرور</label>
      <input id="pw" type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
  </div>`;
}
function toggleMode(){ MODE = MODE==='login' ? 'create' : 'login'; render(); }

async function doLogin(){
  const pw = document.getElementById('pw').value;
  if(!pw){ showToast('اكتب كلمة المرور', true); return; }
  const btn = document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='جارِ الدخول...';
  try{
    const hash = await hashPassword(pw);
    const { data, error } = await sb.from('teachers').select('*').eq('password_hash', hash).limit(1);
    if(error) throw error;
    if(!data || !data.length){ showToast('كلمة المرور غير صحيحة', true); btn.disabled=false; btn.textContent='دخول'; return; }
    localStorage.setItem('teacher_session', JSON.stringify({ id:data[0].id }));
    location.href = './teacher-dashboard.html';
  }catch(e){
    console.error(e);
    showToast('تعذر الاتصال بقاعدة البيانات، تأكد من إعداد Supabase', true);
    btn.disabled=false; btn.textContent='دخول';
  }
}

render();
</script>
</body>
</html>
